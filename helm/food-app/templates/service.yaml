apiVersion: v1
kind: Service
metadata:
  name: food-app
  namespace: monitoring
  labels:
    app: food-app
spec:
  type: ClusterIP
  ports:
    - port: 80          # Tashqariga ko'rinadigan port
      targetPort: 8080  # Pod ichidagi Spring Boot porti
      protocol: TCP
      name: http
  selector:
    app: food-app       # Bu Deploymentdagi podlarni topadi