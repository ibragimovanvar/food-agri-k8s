apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "food-app.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "food-app.labels" . | nindent 4 }}

data:
  application.yaml: |
    spring:
      application:
        name: {{ include "food-app.name" . }}

    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus

      endpoint:
        health:
          show-details: always
          probes:
            enabled: true

      metrics:
        export:
          prometheus:
            enabled: true