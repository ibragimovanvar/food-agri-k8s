{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: food-app
  namespace: monitoring
  labels:
    app: food-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: food-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
{{- end }}